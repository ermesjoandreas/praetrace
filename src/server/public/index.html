<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codemap</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --line: #2a2f38;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  .root {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .counts { margin-left: auto; font-size: 12px; color: var(--muted); }
  main { padding: 24px; overflow: auto; }
  #diagram svg { max-width: none; height: auto; }
  .error {
    border: 1px solid #5a2b2b;
    background: #241a1a;
    border-radius: 6px;
    padding: 16px;
  }
  .error h2 { margin: 0 0 8px; font-size: 13px; color: #f2a2a2; }
  pre {
    margin: 0;
    overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <header>
    <h1>codemap</h1>
    <span class="root" id="root">loading…</span>
    <span class="counts" id="counts"></span>
  </header>
  <main><div id="diagram"></div></main>

  <script src="/vendor/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'strict',
      // A real project overruns the default cap long before it stops being useful.
      maxTextSize: 5000000,
      maxEdges: 5000,
    });

    const diagram = document.getElementById('diagram');

    function showError(title, detail) {
      diagram.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'error';
      const heading = document.createElement('h2');
      heading.textContent = title;
      const body = document.createElement('pre');
      body.textContent = detail;
      box.append(heading, body);
      diagram.append(box);
    }

    async function load() {
      let data;
      try {
        const response = await fetch('/api/diagram');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
      } catch (error) {
        showError('Could not reach the codemap server', String(error));
        return;
      }

      document.getElementById('root').textContent = data.root;
      document.getElementById('counts').textContent =
        data.counts.files + ' files · ' + data.counts.nodes + ' nodes · ' + data.counts.edges + ' edges';

      try {
        const { svg } = await mermaid.render('codemap-diagram', data.source);
        diagram.innerHTML = svg;
      } catch (error) {
        // Showing the source is the fastest way to see what the generator emitted.
        showError('Mermaid could not render the diagram', (error && error.message ? error.message : String(error)) + '\n\n' + data.source);
      }
    }

    load();
  </script>
</body>
</html>
